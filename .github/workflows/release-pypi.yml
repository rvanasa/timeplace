name: Release PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/timeplace
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run Python release script
        run: node scripts/release.mjs python ${{ inputs.publish && '--publish' || '--dry-run' }}
