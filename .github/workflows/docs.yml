name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Python docs
        working-directory: python
        run: uv run --locked pdoc timeplace -o ../site/python

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JS docs
        working-directory: js
        run: |
          npm install
          npx typedoc --out ../site/js

      - name: Web app
        working-directory: web
        run: |
          npm install
          npm run build
          cp -r dist/. ../site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
